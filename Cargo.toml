[workspace]
resolver = "3"
members = [
    "crates/celeris-core",
    "crates/celeris-storage",
    "crates/celeris-cluster",
    "crates/celeris-server",
    "crates/celeris-cli",
    "crates/celeris-testkit",
    "sdks/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/vinitpatil519/CelerisDB"
authors = ["Celeris contributors"]

[workspace.dependencies]
celeris-core = { path = "crates/celeris-core" }
celeris-storage = { path = "crates/celeris-storage" }
celeris-server = { path = "crates/celeris-server" }
celeris-cluster = { path = "crates/celeris-cluster" }
celeris-testkit = { path = "crates/celeris-testkit" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
http-body-util = "0.1"
humantime = "2"
lru = "0.12"
parking_lot = "0.12"
proptest = "1"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "service"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
tungstenite = "0.26"
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
