[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celeris-client"
version = "0.1.0"
description = "Python client for the Celeris distributed key-value / document database: per-request consistency, safe retries, scans, conflicts and live change streams."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["celeris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
