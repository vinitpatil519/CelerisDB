# Celeris on Kubernetes: a 3-node StatefulSet.
#
#   kubectl apply -f deploy/kubernetes/celeris.yaml
#   kubectl rollout status statefulset/celeris
#   kubectl port-forward svc/celeris 8080:8080
#
# Every pod is a control-plane voter. Pod names are the node IDs, and the
# headless Service gives each pod a stable DNS name for the cluster port.
# Once all three are up, the control-plane leader places partitions with
# three replicas on its own. See docs/DEPLOYMENT.md.
apiVersion: v1
kind: Service
metadata:
  name: celeris-peers
  labels: { app.kubernetes.io/name: celeris }
spec:
  clusterIP: None
  # Peers must find each other before they are ready.
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: celeris }
  ports:
    - { name: cluster, port: 7000, targetPort: cluster }
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: celeris
  labels: { app.kubernetes.io/name: celeris }
spec:
  selector: { app.kubernetes.io/name: celeris }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: celeris
spec:
  # Keep a Raft majority (2 of 3) during voluntary disruptions.
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: celeris }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: celeris
  labels: { app.kubernetes.io/name: celeris }
spec:
  serviceName: celeris-peers
  replicas: 3
  # Voters are fixed at bootstrap; start them together.
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app.kubernetes.io/name: celeris }
  template:
    metadata:
      labels: { app.kubernetes.io/name: celeris }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: celeris }
      containers:
        - name: celeris
          image: ghcr.io/vinitpatil519/celeris:latest
          imagePullPolicy: IfNotPresent
          args: ["start"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: cluster, containerPort: 7000 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: CELERIS_NODE_ID, value: "$(POD_NAME)" }
            - { name: CELERIS_HTTP_LISTEN, value: "0.0.0.0:8080" }
            - { name: CELERIS_CLUSTER_LISTEN, value: "0.0.0.0:7000" }
            - name: CELERIS_CLUSTER_ADVERTISE
              value: "$(POD_NAME).celeris-peers.$(POD_NAMESPACE).svc.cluster.local:7000"
            - name: CELERIS_CLUSTER_SEEDS
              value: >-
                celeris-0.celeris-peers.$(POD_NAMESPACE).svc.cluster.local:7000,celeris-1.celeris-peers.$(POD_NAMESPACE).svc.cluster.local:7000,celeris-2.celeris-peers.$(POD_NAMESPACE).svc.cluster.local:7000
            - { name: CELERIS_CLUSTER_VOTERS, value: "celeris-0,celeris-1,celeris-2" }
            - { name: CELERIS_REPLICATION_FACTOR, value: "3" }
            - { name: CELERIS_SYNC, value: "always" }
            - { name: CELERIS_LOG_FORMAT, value: "json" }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/celeris/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 10Gi }
